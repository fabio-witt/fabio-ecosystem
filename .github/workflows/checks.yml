name: Ecosystem checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/lingora/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-site.py
      - run: node --test tests/reliability.test.cjs
      - run: npm ci
        working-directory: src/lingora
      - run: npx tsc --noEmit
        working-directory: src/lingora
      - run: npm run lint
        working-directory: src/lingora
      - run: npm test
        working-directory: src/lingora
